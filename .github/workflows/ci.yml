name: CI

on:
  push:
    branches: [master, accessguard-ci-matrix]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} tests and package smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python files
        run: python -m compileall -q access_audit.py backdoor.py tests
      - name: Run Ruff static checks
        run: |
          python -m pip install ruff coverage
          ruff check --select F,E4,E7,E9,I access_audit.py tests
      - name: Run unit tests with branch coverage
        run: |
          coverage run --branch -m unittest discover -s tests -v
          coverage report --fail-under=75
      - name: Install package
        run: python -m pip install .
      - name: Verify installed command
        run: accessguard --version
      - name: Verify SARIF CLI output
        run: accessguard --format sarif > /tmp/accessguard.sarif
