name: CI

on:
  push:
    branches: [master, accessguard-professional-v1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.10 tests and package smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile Python files
        run: python -m compileall -q access_audit.py backdoor.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Install package
        run: python -m pip install .
      - name: Verify installed command
        run: accessguard --version
      - name: Verify SARIF CLI output
        run: accessguard --format sarif > /tmp/accessguard.sarif
