name: CI

on:
  push:
    branches: [master, security-auditor-foundation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile Python files
        run: python -m compileall -q access_audit.py backdoor.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
